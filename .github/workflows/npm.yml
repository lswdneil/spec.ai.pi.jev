name: npm package

# Builds the npm package spec.jev (kyrn/npm/build.mjs), then installs the tarball on Linux and Windows
# and checks that the installed `spec.jev` runs and loads the judgment layer (kyrn/npm/smoke.mjs). No model is called.
# A `spec.jev-vX.Y.Z` tag also publishes the tarball it checked (the publish job, at the end).
on:
  push:
    branches: [main]
    # Path filters don't apply to tags: every spec.jev tag runs.
    tags: ['spec.jev-v*']
    paths:
      - 'kyrn/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/npm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build pi
        run: npm run build:pinned

      - name: Build and pack spec.jev
        run: node kyrn/npm/build.mjs --pack

      - name: List the tarball
        run: |
          cd .artifacts/npm
          tar -tzf spec.jev-*.tgz | sort > spec.jev-files.txt
          wc -l < spec.jev-files.txt
          sed -E 's#^package/##; s#/.*##' spec.jev-files.txt | sort | uniq -c
          ls -l spec.jev-*.tgz

      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: spec.jev-tarball
          path: |
            .artifacts/npm/spec.jev-*.tgz
            .artifacts/npm/spec.jev-files.txt
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Install and run on ${{ matrix.name }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Node spec.jev supports, and the current one. Windows is x64 only.
          - { name: Linux (Node 22.19), os: ubuntu-latest, node: '22.19.0' }
          - { name: Windows x64, os: windows-2022, node: '24' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: kyrn/npm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Download the tarball
        uses: actions/download-artifact@v8
        with:
          name: spec.jev-tarball
          path: tarball

      # A prefix of its own, as `npm i -g` would use, without touching the runner's global packages.
      - name: Install
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/specjev-prefix"
          npm i -g --prefix "$prefix" ./tarball/spec.jev-*.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then
            # GITHUB_PATH is read by the Windows runner, so write a Windows path, not Git Bash's /d/a/... form.
            cygpath -w "$prefix" >> "$GITHUB_PATH"
          else
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            command="$RUNNER_TEMP/specjev-prefix/spec.jev.cmd"
          else
            command="$RUNNER_TEMP/specjev-prefix/bin/spec.jev"
          fi
          node kyrn/npm/smoke.mjs "$command"

  # npm's trusted publishing: npm trusts this workflow by its OIDC identity, so no npm token is stored anywhere.
  # One-time setup on npmjs.com: spec.jev → Settings → Trusted publishing → GitHub Actions,
  # organization or user lswdneil, repository spec.ai.pi.jev, workflow filename npm.yml.
  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/spec.jev-v')
    needs: [pack, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Download the tarball
        uses: actions/download-artifact@v8
        with:
          name: spec.jev-tarball
          path: tarball

      - name: Check the tag against the tarball and the registry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#spec.jev-v}"
          tarball="tarball/spec.jev-$version.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::The tag says $version, but the package built here is $(ls tarball/*.tgz). Bump kyrn/npm/package.template.json, then tag that commit."
            exit 1
          fi
          if [ -n "$(npm view "spec.jev@$version" version 2>/dev/null)" ]; then
            echo "::error::spec.jev@$version is already on npm."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Authenticate with an npm token when one is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
          fi

      - name: Publish
        # npm treats a bare `dir/file.tgz` as a git spec; `./` makes it the tarball it is.
        run: npm publish "./$TARBALL" --access public --provenance

      - name: Check that npm serves this tarball
        shell: bash
        run: |
          expected=$(shasum -a 1 "$TARBALL" | cut -d' ' -f1)
          for attempt in 1 2 3 4 5 6; do
            served=$(npm view "spec.jev@$VERSION" dist.shasum 2>/dev/null)
            [ -n "$served" ] && break
            sleep 10
          done
          echo "built $expected, served ${served:-nothing}"
          [ "$served" = "$expected" ]
