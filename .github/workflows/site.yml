name: Site

# Builds usemu.dev from site/ and deploys it to Cloudflare Pages (project `usemu`, production branch `main`).
#
# The build reads its facts instead of repeating them (site/build.py says where each comes from): the decision points
# and options from packages/kyrn-judge/manifest.json, the changelog from CHANGELOG.md, each point's question and the
# measurements from the READMEs, and the version, the banner and the download links from the newest GitHub release.
# So it runs when one of those changes: a push to main that touches them, a `v*` tag, a finished Desktop app run
# (the run that publishes a release), and once a day in case a release was edited by hand. It always builds main.
#
# Deploying needs two repository secrets, CLOUDFLARE_API_TOKEN (an API token with the Cloudflare Pages: Edit
# permission) and CLOUDFLARE_ACCOUNT_ID. Without them the site is still built and kept as an artifact, and the deploy
# step is skipped with a notice. Pull requests that touch site/ are built, never deployed.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'site/**'
      - 'packages/kyrn-judge/manifest.json'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/readme/**'
      - 'desktop/packages/desktop/src/renderer/services/i18n/locales/*/agentMode.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: ['Desktop app']
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and deploy
    # After a Desktop app run, only a successful one can have published a release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub's API gives the releases; the token only raises the rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A tag, a Desktop app run or the schedule deploys what main says now, not what the tag's commit said.
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          pip install -r site/requirements.txt
          python site/build.py _site

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: usemu-site
          path: _site
          retention-days: 14

      - name: Setup Node.js
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.112.0 pages deploy _site --project-name usemu --branch main --commit-dirty=true

      - name: Explain a skipped deploy
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "::notice title=Not deployed::Built, but not deployed. Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy usemu.dev."
